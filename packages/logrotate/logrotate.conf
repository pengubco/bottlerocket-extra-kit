# Default logrotate configuration for Bottlerocket.
# See "man logrotate.conf" for details.
#
# Global options do not affect preceding include directives.

# Rotate log files weekly.
weekly

# Keep 4 weeks worth of backlogs.
rotate 4

# Create new (empty) log files after rotating old ones.
create

# Use the date as a suffix of the rotated file.
dateext

# Do not fail the whole run when a configured log file is missing.
missingok

# Do not rotate empty log files.
notifempty

# Compress rotated logs with gzip, which the logrotate package pulls in.
compress

# Keep the most recent rotation uncompressed so it stays easy to read.
delaycompress

# Drop additional log rotation configuration into this directory.
include /etc/logrotate.d
